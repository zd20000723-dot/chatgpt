<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贪吃蛇小游戏</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #111827;
      --panel: #1f2937;
      --text: #e5e7eb;
      --accent: #10b981;
      --danger: #ef4444;
      --grid: #374151;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 20% 20%, #111827 0, #0b1324 50%, #060b1a 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .panel {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid #1f2937;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      padding: 20px;
      max-width: 720px;
      width: 100%;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 0.02em;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #0b1021;
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease;
      box-shadow: 0 10px 30px rgba(34, 197, 94, 0.35);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(34, 197, 94, 0.5);
    }

    button:active {
      transform: translateY(1px);
      filter: brightness(0.95);
    }

    .stats {
      display: flex;
      gap: 12px;
      align-items: center;
      color: #cbd5e1;
      font-weight: 600;
      font-size: 0.95rem;
    }

    canvas {
      width: 100%;
      background: #0b1222;
      border-radius: 12px;
      border: 1px solid #1f2937;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .hint {
      margin-top: 12px;
      color: #94a3b8;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 10px;
      background: rgba(148, 163, 184, 0.12);
      color: #e2e8f0;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .food { color: var(--accent); }
    .danger { color: var(--danger); }
  </style>
</head>
<body>
  <main class="panel">
    <header>
      <h1>贪吃蛇小游戏</h1>
      <div class="controls">
        <button id="start">开始 / 重开</button>
        <div class="stats">
          <span>得分：<strong id="score">0</strong></span>
          <span>最高分：<strong id="best">0</strong></span>
        </div>
      </div>
    </header>
    <canvas id="board" width="540" height="540"></canvas>
    <div class="hint">
      <span class="badge">⬆️ ⬇️ ⬅️ ➡️ 方向键控制移动</span>
      <span class="badge">空格暂停 / 继续</span>
      <span class="badge food">吃到食物 +10 分</span>
      <span class="badge danger">撞墙或撞到自己会失败</span>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('start');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');

    const gridSize = 18;
    const tileSize = canvas.width / gridSize;

    let snake = [];
    let direction = { x: 1, y: 0 };
    let queuedDirection = { x: 1, y: 0 };
    let food = { x: 8, y: 8 };
    let gameLoop = null;
    let score = 0;
    let best = Number(localStorage.getItem('best-score') || 0);
    let isPaused = false;

    const colors = {
      board: '#0b1222',
      grid: 'rgba(148, 163, 184, 0.08)',
      snake: ['#22c55e', '#16a34a'],
      food: '#f97316',
      head: '#a3e635',
    };

    function resetGame() {
      snake = [
        { x: 5, y: 9 },
        { x: 4, y: 9 },
        { x: 3, y: 9 },
      ];
      direction = { x: 1, y: 0 };
      queuedDirection = { ...direction };
      score = 0;
      scoreEl.textContent = score;
      isPaused = false;
      startBtn.textContent = '开始 / 重开';
      spawnFood();
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, 140);
      draw();
    }

    function spawnFood() {
      const openTiles = [];
      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          if (!snake.some((segment) => segment.x === x && segment.y === y)) {
            openTiles.push({ x, y });
          }
        }
      }
      food = openTiles[Math.floor(Math.random() * openTiles.length)];
    }

    function tick() {
      if (isPaused) return;
      direction = queuedDirection;
      const newHead = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y,
      };

      const hitWall =
        newHead.x < 0 ||
        newHead.x >= gridSize ||
        newHead.y < 0 ||
        newHead.y >= gridSize;

      const hitSelf = snake.some((segment) => segment.x === newHead.x && segment.y === newHead.y);

      if (hitWall || hitSelf) {
        endGame();
        return;
      }

      snake.unshift(newHead);
      const ateFood = newHead.x === food.x && newHead.y === food.y;

      if (ateFood) {
        score += 10;
        scoreEl.textContent = score;
        best = Math.max(best, score);
        localStorage.setItem('best-score', best);
        bestEl.textContent = best;
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function endGame() {
      clearInterval(gameLoop);
      ctx.fillStyle = 'rgba(239, 68, 68, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#f87171';
      ctx.font = 'bold 28px "Inter", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('游戏结束 - 按下开始重来', canvas.width / 2, canvas.height / 2);
    }

    function drawGrid() {
      ctx.strokeStyle = colors.grid;
      ctx.lineWidth = 1;
      for (let i = 1; i < gridSize; i++) {
        const offset = i * tileSize;
        ctx.beginPath();
        ctx.moveTo(offset, 0);
        ctx.lineTo(offset, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, offset);
        ctx.lineTo(canvas.width, offset);
        ctx.stroke();
      }
    }

    function drawSnake() {
      snake.forEach((segment, index) => {
        const isHead = index === 0;
        ctx.fillStyle = isHead ? colors.head : colors.snake[index % colors.snake.length];
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
        ctx.lineWidth = 2;
        const padding = 2;
        const x = segment.x * tileSize + padding;
        const y = segment.y * tileSize + padding;
        const size = tileSize - padding * 2;
        ctx.roundRect(x, y, size, size, 6);
        ctx.fill();
        ctx.stroke();
      });
    }

    function drawFood() {
      ctx.fillStyle = colors.food;
      const padding = 4;
      const x = food.x * tileSize + padding;
      const y = food.y * tileSize + padding;
      const size = tileSize - padding * 2;
      ctx.beginPath();
      ctx.arc(x + size / 2, y + size / 2, size / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowColor = 'rgba(249, 115, 22, 0.45)';
      ctx.shadowBlur = 16;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function drawBackground() {
      ctx.fillStyle = colors.board;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawGrid();
    }

    function draw() {
      drawBackground();
      drawFood();
      drawSnake();
    }

    function updateBestDisplay() {
      bestEl.textContent = best;
    }

    function handleDirection(key) {
      const next = { ...direction };
      if (key === 'ArrowUp' && direction.y !== 1) next.x = 0, next.y = -1;
      else if (key === 'ArrowDown' && direction.y !== -1) next.x = 0, next.y = 1;
      else if (key === 'ArrowLeft' && direction.x !== 1) next.x = -1, next.y = 0;
      else if (key === 'ArrowRight' && direction.x !== -1) next.x = 1, next.y = 0;
      queuedDirection = next;
    }

    function togglePause() {
      isPaused = !isPaused;
      startBtn.textContent = isPaused ? '继续游戏' : '开始 / 重开';
    }

    document.addEventListener('keydown', (event) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
        handleDirection(event.key);
        event.preventDefault();
      }

      if (event.code === 'Space') {
        togglePause();
      }
    });

    startBtn.addEventListener('click', resetGame);

    updateBestDisplay();
    resetGame();
  </script>
</body>
</html>
